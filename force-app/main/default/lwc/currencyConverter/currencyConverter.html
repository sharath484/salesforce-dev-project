<template>
    <lightning-card  title="Currency Converter" icon-name="custom:custom14">
        <div class="slds-var-p-around_small">
           <lightning-input name="amount" type="number" label="Enter Amount" value={amount} onchange={changeHandler}></lightning-input>
        </div>
        <div class="slds-var-p-around_small">
            <div class="slds-grid slds-gutters">
  <div class="slds-col">
        <lightning-combobox name="fCurrency" label="From" value={fromCurrency} options={currencyOptions} onchange={changeHandler}></lightning-combobox>
  </div>
  <div class="slds-col">
        <lightning-combobox name="tCurrency" label="To" value={toCurrency} options={currencyOptions} onchange={changeHandler}></lightning-combobox>
  </div>
</div>
        </div>
        <div class="slds-var-p-around_small">
            <lightning-button label="Convert" variant="brand" onclick={convertCurrency}></lightning-button>
        </div>
        <div class="slds-var-p-around_small">
            <p>
            <lightning-formatted-number value={convertedAmount} currency-code={toCurrency}
            currency-display-as="name" format-style="currency">

            </lightning-formatted-number>
            </p>
        </div>
       </lightning-card>
</template>
