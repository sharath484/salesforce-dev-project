   <lightning-card title="Publisher component">

         <lightning-input type="text" label="Description"  onchange={handleDescriptionChange}></lightning-input>
         <lightning-button label="Publish" onclick={publishMessage}></lightning-button>
     </div>
   </lightning-card> 
</template>
